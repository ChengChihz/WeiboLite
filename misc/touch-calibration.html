<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6fa;font:20px sans-serif}#info{position:absolute;top:8px;left:12px;right:12px;color:#223;text-align:center}#dot{position:absolute;width:48px;height:48px;margin:-24px;border-radius:24px;background:#4591ff;border:2px solid white;box-sizing:border-box;pointer-events:none}#mark{position:absolute;width:22px;height:22px;margin:-11px;border:2px solid #e33;border-radius:50%;box-sizing:border-box;pointer-events:none;display:none}</style>
</head><body><div id="info">依次点击蓝点中心，共 5 次。此页不联网。</div><div id="dot"></div><div id="mark"></div><script>
var points=[[.2,.25],[.8,.25],[.5,.5],[.2,.75],[.8,.75]],step=0,maxError=0,targetX=0,targetY=0,waiting=false;
function place(){if(step>=points.length)return;targetX=Math.round(window.innerWidth*points[step][0]);targetY=Math.round(window.innerHeight*points[step][1]);var d=document.getElementById('dot');d.style.left=targetX+'px';d.style.top=targetY+'px';}
document.addEventListener('click',function(e){if(step>=points.length || waiting)return;waiting=true;var dx=e.clientX-targetX,dy=e.clientY-targetY;maxError=Math.max(maxError,Math.round(Math.sqrt(dx*dx+dy*dy)));var m=document.getElementById('mark');m.style.display='block';m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';step++;if(step>=points.length){document.getElementById('dot').style.opacity='.35';document.getElementById('info').textContent='检查完成：最大偏差 '+maxError+' 像素。可截图查看红圈位置。';}else{document.getElementById('info').textContent='已记录 '+step+'/5；红圈是网页收到的位置。';window.setTimeout(function(){place();waiting=false;},250);}},false);
window.onresize=place;place();
</script></body></html>
