<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:18px sans-serif;margin:24px;background:white;color:#222}#state{line-height:1.6}</style>
<script src="core-js.min.js"></script>
</head><body><p id="state" style="display:none"></p>
<script>
window.n9VerificationState='sdk_loading';window.n9VerificationErrorCode=0;window.n9VerificationElapsed=0;
var startedAt=Date.now();
setTimeout(function(){var s=window.n9VerificationState;if(s==='sdk_loading'||s==='provider_loading'||s==='initializing'){window.n9VerificationErrorCode=408;phase('load_error');statusText('验证组件加载超时，请返回后再试。');}},45000);
function phase(s){window.n9VerificationState=s;window.n9VerificationElapsed=Date.now()-startedAt;document.getElementById('state').style.display=(s==='sdk_loading'||s==='provider_loading'||s==='initializing')?'none':'block';}

console.log=function(){if(arguments[0]==='[YidunSDK] Captcha ready'){phase('ready');statusText('请在官方验证框内手动完成验证。');}};
console.error=function(){if(arguments[0]==='[YidunSDK] Captcha initialization failed:'){var e=arguments[1];var n=e && Number(e.code);window.n9VerificationErrorCode=isFinite(n)?n:0;}};
function statusText(text){document.getElementById('state').textContent=text;}
window.onerror=function(){phase('script_error');statusText('验证组件运行出错，请返回后再试。');return true;};
function startVerification(){
 var id=decodeURIComponent(window.location.hash.substring(1));
 if(!/^[A-Za-z0-9_-]{1,2048}$/.test(id)){phase('invalid');statusText('验证会话无效，请返回。');return;}
 phase('initializing');
 window.ydInit({geetestKey:id,captchaId:'7cda0ba2785647ada4d6e946ddb2d465',product:'popup',lang:'zh-CN',defaultFallback:false},function(params,msg,success){
  if(success && msg!=='degrade') {phase('verified');statusText('验证通过，正在继续登录…');}
  else {
   phase(msg==='close'?'closed':'failed');
   var messages={close:'验证已关闭，请返回登录。',onerror:'官方验证组件初始化失败，请返回后再试。',request_err:'验证结果连接失败，请返回后再试。',validation_failed:'微博未通过本次验证，请返回后再试。',degrade:'当前设备无法加载验证，请返回。'};
   statusText(messages[msg] || '验证未完成，请返回后再试。');
  }
 });
}
var script=document.createElement('script');
script.src='https://passport.sinaimg.cn/js/yidun/v1/yidunsdk.min.js';
script.onload=function(){
 if(typeof window.initNECaptcha==='function'){startVerification();return;}
 phase('provider_loading');statusText('正在加载安全验证组件。由于设备性能限制，N9 加载时间较长，请耐心等待。');
 var loader=document.createElement('script');loader.src='https://cstaticdun.126.net/load.min.js';loader.onload=startVerification;
 loader.onerror=function(){phase('load_error');statusText('验证资源加载失败，可点击上方重新加载。');};document.head.appendChild(loader);
};
script.onerror=function(){phase('load_error');statusText('官方验证组件加载失败，请返回。');};
document.head.appendChild(script);
</script></body></html>
